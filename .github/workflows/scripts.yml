name: scripts

on:
  push:
    paths: ["mods/scripts/**", "core/**", "patches/**", ".github/game.ps1", ".github/scripts.ps1", ".github/workflows/scripts.yml"]
  workflow_dispatch:

jobs:
  game:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 3.5.25
            unity: 6000.2.7f2
            arch: x64
            build: kogama--119989fe-87c4-4d35-b53d-7ac0db503f1b
          - version: 3.1.95
            unity: 2022.3.43f1
            arch: Win32
            build: kogama-301095-0eb09042-57bc-4932-af97-6ed48e1afc4f
          - version: 3.0.89
            unity: 2021.3.14f1
            arch: Win32
            build: kogama-300089-7761d252-62f0-4c86-aaf6-d91d4acd112b
          - version: 2.30.13
            unity: 2018.4.32f1
            arch: Win32
            build: kogama-230013-552bb976-0f5e-40fa-b554-05941351472d
          - version: 2.30.6
            unity: 2018.4.31f1
            arch: Win32
            build: kogama-230006-57eff71c-042d-416b-b01b-b2c2e0c9cce5
          - version: 2.30.2
            unity: 2018.3.14f1
            arch: Win32
            build: kogama-230002-a29947a9-e304-462f-bc56-11e133c4538f
          - version: 2.6.11
            unity: 2018.2.0f2
            arch: Win32
            build: kogama-206011-95208d4c-d0ad-4f8a-a842-2d79f4054880
          - version: 1.88.0
            unity: 5.3.8p2
            arch: Win32
            build: kogama-188000-4625ac7c-e84e-4f6b-b594-7ad27c45eace
          - version: 1.75.3
            unity: 5.6.4f1
            arch: Win32
            build: kogama-175003-6b237e17-95fc-47d3-8ba2-010877881f1c
          - version: 1.32.7
            unity: 5.2.4f1
            arch: Win32
            build: kogama-132007-3dd6f58e-9ecc-47ec-9ed7-98ee7f7e322e
          - version: 1.25.13
            unity: 5.1.3f1
            arch: Win32
            build: kogama-125013-91c8d25a-2e42-4eac-af16-54dd20128614
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          path: openkogama-mods
      - name: pick the server branch
        id: server
        shell: bash
        run: |
          if git ls-remote --exit-code --heads https://github.com/openkogama/openkogama-server.git "$GITHUB_REF_NAME" > /dev/null; then echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        with:
          repository: openkogama/openkogama-server
          ref: ${{ steps.server.outputs.ref }}
          path: server-src
      - uses: actions/checkout@v4
        with:
          repository: openkogama/openkogama-photon
          path: openkogama-photon
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: build server, core and patcher
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build server-src/openkogama-server.csproj -c Release -o server
          dotnet build server-src/examples/online/online.csproj -c Release -o plugins
          cmake -S core -B core/build -A ${{ matrix.arch }}
          cmake --build core/build --config Release
          dotnet build patcher/OpenKogama.Mods.Patcher.csproj -c Release
          dotnet build shim/OkModShim.csproj -c Release

      - name: sandbox and api tests
        run: ctest --test-dir core/build -C Release -R scripts --output-on-failure

      - name: cache client ${{ matrix.version }}
        id: client
        uses: actions/cache@v4
        with:
          path: client
          key: client-${{ matrix.build }}
      - name: download client ${{ matrix.version }}
        if: steps.client.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/bustersky13/kogama-version-tracker/releases/download/versions/${{ matrix.build }}.zip" -OutFile client.zip
          Expand-Archive client.zip -DestinationPath client

      - name: patch client
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Copy-Item client game -Recurse
          $exe = Get-ChildItem game -Recurse -Filter *.exe | Where-Object { $_.Name -notmatch "crash|handler|UnityCrash" } | Select-Object -First 1
          $game = Get-ChildItem game -Recurse -Filter GameAssembly.dll | Select-Object -First 1
          if ($game) {
            Copy-Item $game.FullName "$($game.FullName).original"
            dotnet server/openkogama-server.dll client fix "$($game.FullName).original" $game.FullName mods
          } else {
            $asm = (Get-ChildItem game -Recurse -Filter Assembly-CSharp.dll | Where-Object { $_.FullName -match "Managed" } | Select-Object -First 1).FullName
            $shim = (Get-ChildItem shim/bin/Release -Recurse -Filter OkModShim.dll | Select-Object -First 1).FullName
            Copy-Item $shim (Split-Path $asm)
            Copy-Item $asm "$asm.original"
            dotnet server/openkogama-server.dll client fix "$asm.original" $asm mods
          }
          Copy-Item core/build/Release/okmod.dll $exe.DirectoryName

      - name: play with and without scripts
        shell: pwsh
        run: ./.github/scripts.ps1 -Client game -Server server -Mods core/build/Release -Scripts mods/scripts/test/game -Plugins plugins -Out shots -Version ${{ matrix.version }} -Unity ${{ matrix.unity }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scripts-${{ matrix.version }}
          path: shots
